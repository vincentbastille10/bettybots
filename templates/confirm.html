<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Confirmation du paiement — Votre bot est prêt</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg:#0b0b0c; --card:#111214; --line:#23262d; 
      --text:#e7e9ee; --muted:#a7adbb; --primary:#4F46E5;
    }
    body {
      margin:0; background:var(--bg); color:var(--text);
      font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
      display:flex; justify-content:center; align-items:center; height:100vh;
    }
    .card {
      background:var(--card); border:1px solid var(--line); border-radius:14px;
      padding:30px; max-width:680px; width:90%;
      text-align:center; box-shadow:0 0 25px rgba(0,0,0,.3);
    }
    h1 { margin-top:0; font-size:24px; color:#fff; }
    pre {
      background:#0f1012; border:1px solid var(--line);
      border-radius:12px; padding:16px; text-align:left;
      color:#9ef; font-size:14px; overflow-x:auto;
    }
    button {
      margin-top:18px; padding:12px 18px; border:none; border-radius:10px;
      background:var(--primary); color:#fff; font-weight:600; cursor:pointer;
    }
    button:disabled { opacity:.6; cursor:not-allowed; }
    .msg { margin-top:16px; font-size:14px; color:var(--muted); }
  </style>
</head>

<body>
  <div class="card">
    <h1>✅ Paiement confirmé !</h1>
    <p>Merci pour votre achat. Voici votre code d’intégration :</p>

    <pre id="embedCode">&lt;iframe src="{{ public_url or 'https://bettybots.vercel.app/chat?bot=' ~ bot_id }}" 
style="border:0;width:420px;height:580px;border-radius:18px;box-shadow:0 0 25px rgba(0,0,0,.4);" 
title="Mon Betty Bot"&gt;&lt;/iframe&gt;</pre>

    <button id="sendBtn">📧 Envoyer ce code à mon adresse e-mail d’inscription</button>
    <div id="msg" class="msg"></div>
  </div>

  <script>
    const sendBtn = document.getElementById('sendBtn');
    const msgEl = document.getElementById('msg');
    const code = document.getElementById('embedCode').textContent;

    sendBtn.addEventListener('click', async () => {
      sendBtn.disabled = true;
      msgEl.textContent = "Envoi en cours...";
      try {
        const res = await fetch('/api/send_code', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code })
        });
        if (res.ok) {
          msgEl.textContent = "✅ Le code d’intégration a été envoyé à votre adresse e-mail.";
        } else {
          msgEl.textContent = "⚠️ Échec de l’envoi. Réessayez plus tard.";
        }
      } catch (e) {
        msgEl.textContent = "⚠️ Erreur de connexion avec le serveur.";
      }
      sendBtn.disabled = false;
    });
  </script>
</body>
</html>
