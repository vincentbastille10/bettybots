<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Tester le bot</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
  <style>
    #log{border:1px solid #ddd;padding:1rem;min-height:200px;max-width:640px}
    .bubble{margin:.25rem 0}
    .user{color:#111}
    .bot{color:#4F46E5}
  </style>
</head>
<body>
  {% if warning %}<p style="color:#b00">{{ warning }}</p>{% endif %}
  <h1>Sandbox</h1>
  <div id="log"></div>
  <form id="f" style="margin-top:1rem;display:flex;gap:.5rem" onsubmit="sendMsg(event)">
    <input id="m" placeholder="Votre message..." style="flex:1;padding:.5rem" />
    <button>Envoyer</button>
  </form>
  <script>
    async function sendMsg(e){
      e.preventDefault();
      const m = document.getElementById('m');
      const v = m.value.trim();
      if(!v) return;
      add('user', v);
      m.value='';
      const r = await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:v})});
      const j = await r.json();
      add('bot', j.reply || '(pas de réponse)');
    }
    function add(role, text){
      const el = document.createElement('div');
      el.className='bubble '+role;
      el.textContent = (role==='user'?'👤 ':'🤖 ')+text;
      document.getElementById('log').appendChild(el);
    }
  </script>
  <p style="margin-top:1rem"><a href="{{ url_for('dashboard') }}">← Retour</a></p>
</body>
</html>
