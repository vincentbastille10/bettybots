<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Betty — Assistant conversationnel</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  <style>
    body {
      background: #0d1117;
      color: #fff;
      font-family: "Inter", system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    .chat-container {
      background: #111827;
      width: 420px;
      height: 580px;
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 0 25px rgba(0,0,0,0.4);
      border: 1px solid #1f2937;
    }

    .chat-header {
      background: #1f2937;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      border-bottom: 1px solid #374151;
    }

    .chat-header img {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      margin-right: 10px;
      border: 2px solid #ef4444;
    }

    .chat-header h3 {
      margin: 0;
      font-size: 16px;
      color: #f9fafb;
      font-weight: 600;
    }

    .chat-header span {
      font-size: 13px;
      color: #9ca3af;
    }

    .chat-messages {
      flex: 1;
      padding: 14px;
      overflow-y: auto;
      background: #111827;
    }

    .message {
      max-width: 80%;
      margin-bottom: 12px;
      padding: 10px 14px;
      border-radius: 12px;
      line-height: 1.4;
      font-size: 15px;
    }

    .user {
      background: #2563eb;
      color: white;
      align-self: flex-end;
      margin-left: auto;
    }

    .bot {
      background: #272f3d;
      color: #f3f4f6;
      align-self: flex-start;
    }

    .chat-input {
      display: flex;
      padding: 10px;
      background: #1f2937;
      border-top: 1px solid #374151;
    }

    .chat-input input {
      flex: 1;
      background: #111827;
      border: 1px solid #374151;
      border-radius: 8px;
      padding: 10px 14px;
      color: #fff;
      font-size: 14px;
    }

    .chat-input button {
      background: #ef4444;
      border: none;
      color: white;
      font-weight: 600;
      border-radius: 8px;
      padding: 10px 16px;
      margin-left: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .chat-input button:hover {
      background: #dc2626;
    }
  </style>
</head>

<body>
  <div class="chat-container">
    <div class="chat-header">
      <img src="{{ avatar_url }}" alt="Betty Avatar">
      <div>
        <h3>Betty</h3>
        <span>Votre assistante {{ role|lower }}</span>
      </div>
    </div>

    <div class="chat-messages" id="chatMessages">
      <div class="message bot">👋 Bonjour ! Je suis Betty, l’assistante {{ role|lower }}.<br>Comment puis-je vous aider ?</div>
    </div>

    <div class="chat-input">
      <input id="userInput" type="text" placeholder="Écrivez votre message ici..." autocomplete="off">
      <button id="sendBtn">Envoyer</button>
    </div>
  </div>

  <script>
    const sendBtn = document.getElementById("sendBtn");
    const userInput = document.getElementById("userInput");
    const chatMessages = document.getElementById("chatMessages");

    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text) return;

      appendMessage("user", text);
      userInput.value = "";

      const resp = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          tenant: "{{ tenant }}",
          role: "{{ role }}",
          text
        })
      });
      const data = await resp.json();
      appendMessage("bot", data.reply);
    }

    function appendMessage(sender, text) {
      const msg = document.createElement("div");
      msg.className = "message " + sender;
      msg.textContent = text;
      chatMessages.appendChild(msg);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    sendBtn.addEventListener("click", sendMessage);
    userInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") sendMessage();
    });
  </script>
</body>
</html>
