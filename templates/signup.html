<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Inscription</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
  <style>label{display:block;margin:.5rem 0 .2rem}input{width:320px;max-width:100%;padding:.5rem}</style>
</head>
<body>
  <h1>Inscription</h1>
  <form method="post" action="{{ url_for('signup') }}">
    <label>Prénom</label>
    <input name="first_name" type="text" />
    <label>Nom</label>
    <input name="last_name" type="text" />
    <label>Email</label>
    <input name="email" type="email" required />
    <label>Confirmez l’email</label>
    <input name="email_confirm" type="email" required />
    <div style="margin-top:1rem">
      <button type="submit">Créer mon compte</button>
    </div>
  </form>
  <p style="margin-top:1rem"><a href="{{ url_for('landing') }}">← Retour</a></p>
</body>
</html>
