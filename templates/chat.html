<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Betty — votre assistante</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #fff6fa;
      font-family: 'Inter', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      height: 100vh;
    }

    .header {
      text-align: center;
      margin-top: 40px;
    }

    .header img {
      width: 100px;
      height: 100px;
      margin-bottom: 10px;
    }

    .header h2 {
      background: #f0c9e0;
      color: #1a1a1a;
      padding: 15px 25px;
      border-radius: 20px;
      display: inline-block;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .chat-box {
      width: 80%;
      max-width: 900px;
      height: 400px;
      background: white;
      border-radius: 30px;
      box-shadow: 0 4px 25px rgba(0, 0, 0, 0.1);
      margin-top: 30px;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
    }

    .message {
      max-width: 70%;
      margin-bottom: 15px;
      padding: 12px 18px;
      border-radius: 20px;
      font-size: 16px;
      line-height: 1.4;
    }

    .user {
      align-self: flex-end;
      background: #fdd0e8;
    }

    .bot {
      align-self: flex-start;
      background: #f4f4f8;
    }

    .input-zone {
      width: 80%;
      max-width: 900px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 20px;
      background: white;
      border-radius: 30px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      padding: 5px 10px;
    }

    .input-zone input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 16px;
      padding: 15px;
      border-radius: 30px;
      background: transparent;
    }

    .input-zone button {
      background: #ff5fa2;
      border: none;
      color: white;
      font-weight: bold;
      font-size: 16px;
      border-radius: 25px;
      padding: 12px 20px;
      cursor: pointer;
      transition: 0.3s;
    }

    .input-zone button:hover {
      background: #ff3e91;
    }
  </style>
</head>

<body>
  <div class="header">
    <img src="{{ avatar or 'https://i.ibb.co/bjqWmV09/Betty-Medecine-copie.jpg' }}" alt="Betty" />
    <h2>Bonjour ! Je suis Betty,<br> l’assistante du Centre de Danse Delphine Letort 🩰<br>
    Que puis-je faire pour vous ?</h2>
  </div>

  <div class="chat-box" id="chat-box">
    <div class="message bot">Bonjour 👋 Je suis là pour vous aider !</div>
  </div>

  <div class="input-zone">
    <input type="text" id="userInput" placeholder="Écrivez votre message ici…" />
    <button onclick="sendMessage()">Envoyer</button>
  </div>

  <script>
    const chatBox = document.getElementById('chat-box');
    const userInput = document.getElementById('userInput');

    function addMessage(content, sender) {
      const div = document.createElement('div');
      div.className = 'message ' + sender;
      div.innerText = content;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text) return;

      addMessage(text, 'user');
      userInput.value = '';

      // Simule la réponse de Betty (tu pourras connecter ton backend Flask ici)
      addMessage('Je réfléchis...', 'bot');
      await new Promise(r => setTimeout(r, 1200));

      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text })
      });

      const data = await res.json();
      document.querySelector('.message.bot:last-child').innerText = data.reply || 'Désolée, je n’ai pas compris.';
    }
  </script>
</body>
</html>
