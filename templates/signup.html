<!doctype html>
<html><head><meta charset="utf-8"><title>Inscription</title></head>
<body style="font-family:system-ui;margin:40px;max-width:520px">
  <h1>Inscription</h1>
  <form method="post" action="{{ url_for('signup') }}">
    <label>Nom<br><input name="name"/></label><br><br>
    <label>Email<br><input type="email" name="email" required></label><br><br>
    <label>Mot de passe<br><input type="password" name="password" required></label><br><br>
    <button type="submit">Créer mon compte</button>
  </form>
  <p style="margin-top:16px">
    <a href="{{ url_for('auth_google') }}">Connexion via Google</a>
  </p>
  <p><a href="{{ url_for('login') }}">Déjà inscrit ? Se connecter</a></p>
</body></html>
