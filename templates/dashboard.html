<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Configuration de mon Betty Bot</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root{--bg:#0b0b0c;--card:#111214;--line:#23262d;--text:#e7e9ee;--muted:#a7adbb;--primary:#4F46E5}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
    .wrap{max-width:900px;margin:40px auto;padding:0 20px}
    h1{margin:0 0 14px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    label{font-size:13px;color:var(--muted)}
    input,select,textarea{
      width:100%;margin-top:6px;margin-bottom:14px;padding:10px;border-radius:10px;
      border:1px solid var(--line);background:#0f1012;color:var(--text)
    }
    textarea{min-height:96px}
    .row{display:flex;gap:10px;align-items:center;margin-top:10px}
    .btn{padding:12px 14px;border:0;border-radius:12px;cursor:pointer;font-weight:600}
    .primary{background:var(--primary);color:#fff}
    .ghost{background:transparent;border:1px solid var(--line);color:#fff}
    .right{margin-left:auto}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Configurer mon Betty Bot</h1>

    <!-- IMPORTANT : action = /dashboard (PAS /dashboard/generate) -->
    <form action="/dashboard" method="post" class="card" id="botForm">
      <div class="grid">
        <div>
          <label>Nom du bot
            <input type="text" name="name" value="{{ (bot.name if bot else '') or 'Betty' }}">
          </label>

          <label>Métier
            <select name="metier">
              {% set m = (bot.metier if bot else '') %}
              <option value="Avocate" {{ 'selected' if m=='Avocate' else '' }}>Avocate</option>
              <option value="Agent Immo" {{ 'selected' if m=='Agent Immo' else '' }}>Agent Immo</option>
              <option value="Médecine" {{ 'selected' if m=='Médecine' else '' }}>Médecine</option>
              <option value="Comptable" {{ 'selected' if m=='Comptable' else '' }}>Comptable</option>
              <option value="Psychologue" {{ 'selected' if m=='Psychologue' else '' }}>Psychologue</option>
            </select>
          </label>

          <label>Avatar (URL)
            <input type="url" name="avatar_url" value="{{ (bot.avatar_url if bot else '') or '' }}" placeholder="https://…">
          </label>

          <label>Couleur primaire (hex)
            <input type="text" name="color_hex" value="{{ (bot.color_hex if bot else '') or '#4F46E5' }}">
          </label>
        </div>

        <div>
          <label>Forme d’avatar
            {% set shape = (bot.shape if bot else 'rounded') %}
            <select name="shape">
              <option value="rounded" {{ 'selected' if shape=='rounded' else '' }}>Arrondi</option>
              <option value="circle"  {{ 'selected' if shape=='circle'  else '' }}>Cercle</option>
              <option value="square"  {{ 'selected' if shape=='square'  else '' }}>Carré</option>
            </select>
          </label>

          <label>Persona
            <input type="text" name="persona" value="{{ (bot.persona if bot else '') or 'Assistant' }}">
          </label>

          <label>Message d’accueil
            <textarea name="welcome_text">{{ (bot.welcome_text if bot else '') or 'Bonjour 👋' }}</textarea>
          </label>
        </div>
      </div>

      <div class="row">
        <a class="btn ghost" href="/preview" title="Voir l’aperçu sans enregistrer">Voir l’aperçu</a>
        <div class="right"></div>
        <button type="submit" class="btn primary">Enregistrer &amp; tester</button>
      </div>
    </form>
  </div>
</body>
</html>
