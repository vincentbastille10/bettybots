<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Configuration de votre bot</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  <style>
    body{background:#0d1117;color:#e5e7eb;font-family:Inter,system-ui,sans-serif;margin:0;padding:32px}
    h1{margin:0 0 24px}
    .card{background:#111827;border:1px solid #1f2937;border-radius:14px;padding:20px;max-width:920px}
    .row{margin-bottom:18px}
    label{display:block;margin-bottom:8px;font-weight:600}
    select, input[type=text], textarea{width:100%;background:#0b1220;border:1px solid #293041;color:#fff;border-radius:8px;padding:10px 12px}
    .flex{display:flex;gap:16px;flex-wrap:wrap}
    .color-dot{width:28px;height:28px;border-radius:50%;border:2px solid #1f2937;cursor:pointer}
    .avatars{display:grid;grid-template-columns:repeat(3, 200px);gap:16px}
    .avatar{border:2px solid transparent;border-radius:12px;overflow:hidden;cursor:pointer}
    .avatar.selected{border-color:#2563eb}
    .avatar img{width:100%;height:140px;object-fit:cover;display:block}
    .btns{display:flex;gap:10px;margin-top:8px}
    .btn{background:#1f2937;border:1px solid #374151;color:#e5e7eb;padding:10px 14px;border-radius:8px;cursor:pointer}
    .btn.primary{background:#2563eb;border-color:#1d4ed8}
  </style>
</head>
<body>
  <h1>Configuration de votre bot</h1>
  <p>Bienvenue {{ name }} ({{ email }}) — <b>tenant:</b> {{ tenant }}</p>

  <form method="POST" action="{{ url_for('save_dashboard') }}" class="card">
    <input type="hidden" name="tenant" value="{{ tenant }}" />
    <input type="hidden" id="avatar" name="avatar" value="{{ avatar or '' }}" />
    <input type="hidden" id="color"  name="color"  value="{{ color or '#2563eb' }}" />

    <!-- Métier -->
    <div class="row">
      <label for="role">Métier</label>
      <select id="role" name="role">
        <option value="psychologue" {{ 'selected' if role=='psychologue' else '' }}>Psychologue</option>
        <option value="agent immobilier" {{ 'selected' if role=='agent immobilier' else '' }}>Agent Immobilier</option>
        <option value="avocat" {{ 'selected' if role=='avocat' else '' }}>Avocat / Avocate</option>
        <option value="medecin" {{ 'selected' if role=='medecin' else '' }}>Médecin</option>
        <option value="comptable" {{ 'selected' if role=='comptable' else '' }}>Comptable</option>
        <option value="danse" {{ 'selected' if role=='danse' else '' }}>Danse (assistant·e)</option>
      </select>
    </div>

    <!-- Couleur -->
    <div class="row">
      <label>Couleur (thème)</label>
      <div class="flex" id="colorPicker">
        {% for c in ['#2563eb','#22c55e','#8b5cf6','#ef4444','#f59e0b','#06b6d4','#111827','#f5f5f5'] %}
          <div class="color-dot" data-color="{{ c }}" style="background:{{ c }}"></div>
        {% endfor %}
      </div>
    </div>

    <!-- Avatar -->
    <div class="row">
      <label>Avatar</label>
      <div class="avatars" id="avatarGrid">
        <!-- Mets ici tes URLs d'avatars (3 exemples) -->
        <div class="avatar"><img data-src="https://i.ibb.co/xKr7s8Nk/Betty-Avocate-copie.jpg" alt=""></div>
        <div class="avatar"><img data-src="https://i.ibb.co/CKFQ2cdN/Betty-Agent-immo-copie.jpg" alt=""></div>
        <div class="avatar"><img data-src="https://i.ibb.co/bjqWmV09/Betty-Medecine-copie.jpg" alt=""></div>
      </div>
    </div>

    <!-- Personnalité -->
    <div class="row">
      <label for="persona">Personnalité</label>
      <select id="persona" name="persona">
        <option value="neutre" {{ 'selected' if persona=='neutre' else '' }}>Neutre (clair, pro)</option>
        <option value="bienveillante" {{ 'selected' if persona=='bienveillante' else '' }}>Bienveillante (chaleureuse)</option>
        <option value="directe" {{ 'selected' if persona=='directe' else '' }}>Directe (rapide, concise)</option>
        <option value="experte" {{ 'selected' if persona=='experte' else '' }}>Experte (détaillée)</option>
      </select>
    </div>

    <!-- Message d’accueil -->
    <div class="row">
      <label for="welcome_message">Message d’accueil</label>
      <textarea id="welcome_message" name="welcome_message" rows="3"
        placeholder="👋 Bonjour ! Je suis Betty, l’assistante AI. Posez votre question…">{{ welcome_message or "👋 Bonjour ! Je suis Betty, l’assistante AI. Posez votre question…" }}</textarea>
      <small>Le nom “Betty” reste fixe, tu personnalises le reste.</small>
    </div>

    <div class="btns">
      <button class="btn primary" type="submit">Enregistrer & prévisualiser</button>
      <a class="btn" href="{{ url_for('welcome') }}">Retour accueil</a>
    </div>
  </form>

  <script>
    // Couleur
    const colorInput = document.getElementById('color');
    document.querySelectorAll('#colorPicker .color-dot').forEach(dot=>{
      if (dot.dataset.color.toLowerCase() === (colorInput.value||'').toLowerCase()) {
        dot.style.outline='3px solid #fff';
      }
      dot.addEventListener('click', ()=>{
        colorInput.value = dot.dataset.color;
        document.querySelectorAll('#colorPicker .color-dot').forEach(d=>d.style.outline='none');
        dot.style.outline='3px solid #fff';
      });
    });

    // Avatar
    const avatarInput = document.getElementById('avatar');
    const current = avatarInput.value;
    document.querySelectorAll('#avatarGrid .avatar').forEach(box=>{
      const url = box.querySelector('img').dataset.src;
      box.querySelector('img').src = url;
      if (current && url === current) box.classList.add('selected');
      box.addEventListener('click', ()=>{
        avatarInput.value = url;
        document.querySelectorAll('#avatarGrid .avatar').forEach(b=>b.classList.remove('selected'));
        box.classList.add('selected');
      });
    });
  </script>
</body>
</html>
