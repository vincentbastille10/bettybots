<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Connexion — Betty Bots</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;margin:40px}
    .card{max-width:520px;margin:auto;padding:24px;border:1px solid #e5e7eb;border-radius:12px}
    label{display:block;margin:12px 0 6px}
    input{width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px}
    button{margin-top:16px;padding:10px 14px;border:0;background:#4F46E5;color:#fff;border-radius:10px;cursor:pointer}
    .links a{margin-right:12px}
    .flash{background:#fee2e2;border:1px solid #ef4444;color:#991b1b;padding:10px 12px;border-radius:8px;margin-bottom:12px}
  </style>
</head>
<body>
  <div class="card">
    <h1>Se connecter</h1>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for cat,msg in messages %}
          <div class="flash"><b>{{ cat }}</b> — {{ msg }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="post" action="{{ url_for('login') }}">
      <label>Email</label>
      <input name="email" type="email" required>

      <label>Mot de passe</label>
      <input name="password" type="password" required>

      <button type="submit">Connexion</button>
    </form>

    <div class="links" style="margin-top:14px">
      <a href="{{ url_for('auth_google') }}">Se connecter avec Google</a>
      <a href="{{ url_for('signup') }}">Créer un compte</a>
    </div>
  </div>
</body>
</html>
