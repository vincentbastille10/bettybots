<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Aperçu du bot</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root { --primary:#4F46E5; --bg:#0b0b0c; --card:#111214; --line:#23262d; --text:#e7e9ee; --muted:#a7adbb; }
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Inter,sans-serif;background:var(--bg);color:var(--text);margin:0}
    .wrap{max-width:900px;margin:40px auto;padding:0 20px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin:14px 0}
    h1{margin:0 0 10px}
    .muted{color:var(--muted)}
    #out{background:#0f1012;border:1px solid var(--line);border-radius:10px;min-height:160px;padding:12px;white-space:pre-wrap}
    input[type=text]{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#0f1012;color:var(--text)}
    .row{display:grid;grid-template-columns:2fr 1fr;gap:14px}
    .btn{appearance:none;border:0;background:var(--primary);color:#fff;font-weight:600;padding:12px 16px;border-radius:12px;cursor:pointer}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Aperçu du bot : {{ cfg.name }}</h1>
    {% if warning %}<p class="muted">{{ warning }}</p>{% endif %}
    <div class="card">
      <div class="row">
        <div>
          <form onsubmit="event.preventDefault(); sendMsg();">
            <input id="msg" type="text" placeholder="Votre message…">
          </form>
          <div id="out" style="margin-top:12px">{{ cfg.welcome }}</div>
        </div>
        <div>
          <form method="post" action="/dashboard/save_and_pay">
            <button class="btn" type="submit" style="width:100%">Enregistrer → Paiement</button>
          </form>
          <form method="post" action="/preview/reset" style="margin-top:8px">
            <button class="btn" type="submit" style="width:100%;background:#2c2f36">Réinitialiser la conversation</button>
          </form>
        </div>
      </div>
    </div>
  </div>
  <script>
    async function sendMsg(){
      const input = document.getElementById('msg');
      const m = (input.value || '').trim();
      if(!m) return;
      const r = await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:m})});
      const j = await r.json();
      const out = document.getElementById('out');
      out.textContent = (j.reply || JSON.stringify(j,null,2));
      input.value='';
    }
  </script>
</body>
</html>
