<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Confirmation</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
</head>
<body>
  <h1>Abonnement confirmé</h1>
  {% if amount %}
    <p>Montant payé : {{ amount }} {{ currency }}</p>
  {% else %}
    <p>Merci ! Votre abonnement est actif.</p>
  {% endif %}
  <p>Le code d’intégration vous sera envoyé par email.</p>
  <p><a href="{{ url_for('dashboard') }}">Aller au dashboard</a></p>
</body>
</html>
