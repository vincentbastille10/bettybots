<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Prévisualisation du bot</title>
  <style>
    body{background:#0d1117;color:#e5e7eb;font-family:Inter,system-ui,sans-serif;margin:0;padding:40px}
    h1{margin:0 0 8px}
    p{margin:0 0 20px}
    iframe{border:0;border-radius:18px;width:420px;height:580px;box-shadow:0 0 25px rgba(0,0,0,.4)}
    .btns{margin-top:20px;display:flex;gap:10px}
    .btn{background:#1f2937;border:1px solid #374151;color:#e5e7eb;padding:10px 14px;border-radius:8px;cursor:pointer;text-decoration:none}
    .btn.primary{background:#2563eb;border-color:#1d4ed8}
  </style>
</head>
<body>
  <h1>Prévisualisation du bot</h1>
  <p>Testez votre bot avant de vous abonner.</p>

  <!-- on affiche la VRAIE fenêtre carrée -->
  <iframe src="/chat?tenant={{ tenant }}"></iframe>

  <div class="btns">
    <a class="btn" href="{{ url_for('dashboard', tenant=tenant) }}">Revenir à la configuration</a>
    <a class="btn primary" href="{{ url_for('pay', tenant=tenant) }}">S’abonner</a>
  </div>
</body>
</html>
