<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Aperçu du bot</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto;max-width:780px;margin:40px auto;padding:0 16px}
    #out{background:#f6f6f6;padding:12px;border-radius:8px;min-height:140px;white-space:pre-wrap}
    button{padding:10px 16px;border:0;border-radius:10px;cursor:pointer}
    .primary{background:#4F46E5;color:#fff}
  </style>
</head>
<body>
  <h1>Aperçu du bot : {{ cfg.name }}</h1>
  {% if warning %}<p><em>{{ warning }}</em></p>{% endif %}

  <div>
    <strong>Message d’accueil :</strong> {{ cfg.welcome }}
  </div>

  <form onsubmit="event.preventDefault(); sendMsg();">
    <input id="msg" placeholder="Votre message..." style="width:70%">
    <button type="submit">Envoyer</button>
  </form>
  <pre id="out"></pre>

  <form method="post" action="/dashboard/save_and_pay" style="margin-top:20px">
    <button class="primary" type="submit">Enregistrer → Paiement</button>
  </form>

  <form method="post" action="/preview/reset" style="margin-top:10px">
    <button type="submit">Réinitialiser la conversation</button>
  </form>

  <script>
    async function sendMsg(){
      const m = document.getElementById('msg').value.trim();
      if(!m) return;
      const r = await fetch('/api/chat',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({message:m})
      });
      const j = await r.json();
      document.getElementById('out').textContent = (j.reply || JSON.stringify(j,null,2));
      document.getElementById('msg').value = '';
    }
  </script>
</body>
</html>
