[project]
name = "bettybots"
version = "0.1.0"
description = "BettyBots Flask app for Vercel"
requires-python = ">=3.12"
dependencies = [
  "Flask==3.0.3",
  "flask-login==0.6.3",
  "python-dotenv==1.0.1",
  "PyYAML==6.0.2",
  "stripe==9.12.0"
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
