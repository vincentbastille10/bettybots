<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Paiement – Abonnement</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
</head>
<body>
  <h1>Payer l’abonnement</h1>
  <button id="pay">Procéder au paiement</button>

  <script>
    const btn = document.getElementById('pay');
    btn.onclick = async () => {
      btn.disabled = true;
      try {
        const res = await fetch('/api/pay', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ mode: 'subscription', quantity: 1 })
        });
        const data = await res.json();
        if (data.url) {
          window.location.href = data.url;
        } else {
          alert('Erreur Stripe: ' + (data.error || 'inconnue'));
          btn.disabled = false;
        }
      } catch (e) {
        alert('Erreur réseau: ' + e);
        btn.disabled = false;
      }
    };
  </script>
</body>
</html>
