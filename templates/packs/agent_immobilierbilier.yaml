faqs:
- q: "Faites-vous des estimations gratuites ?"
  a: "Oui, une estimation gratuite et sans engagement est possible. Nous combinons méthode comparative, historique des ventes et spécificités du bien pour établir un avis de valeur précis. Dites “rappel” pour convenir d’un créneau."
  tags: [estimation]
- q: "Comment calculez-vous le prix au m² ?"
  a: "Nous croisons les références de ventes récentes, les données notariales et les caractéristiques (surface Carrez, étage, état, extérieurs, luminosité) pour ajuster le prix au m²."
  tags: [estimation]
- q: "Quelle est la différence entre estimation en ligne et sur place ?"
  a: "L'estimation en ligne donne une fourchette indicative. La visite sur place tient compte des atouts et des travaux, ce qui affine le prix et la stratégie de mise en vente."
  tags: [estimation]
- q: "Quelle différence entre mandat simple et mandat exclusif ?"
  a: "Le mandat exclusif confie la vente à une seule agence, avec une mise en valeur renforcée et une diffusion contrôlée. Le mandat simple permet de multiplier les diffuseurs, mais peut diluer la stratégie."
  tags: [mandats]
- q: "Quelle est la durée d’un mandat ?"
  a: "La durée légale minimale est de 3 mois, renouvelable par tacite reconduction ou avenant. Nous conseillons 3 à 6 mois pour mener une commercialisation efficace."
  tags: [mandats]
- q: "Quels diagnostics sont obligatoires pour vendre ?"
  a: "Le dossier de diagnostics techniques comprend selon les cas : DPE, amiante, plomb, électricité, gaz, termites, ERP, métrage Carrez (en copropriété). Nous pouvons organiser leur réalisation."
  tags: [diagnostics]
- q: "Le DPE est-il obligatoire ?"
  a: "Oui, le DPE est obligatoire dès la mise en annonce. Il informe sur la performance énergétique et peut influencer la valeur et les délais de vente."
  tags: [diagnostics]
- q: "Comment valorisez-vous mon bien ?"
  a: "Photos professionnelles HDR, home staging léger, plans cotés, visite virtuelle et rédaction d’annonce optimisée. Diffusion ciblée sur les portails majeurs et notre base d’acheteurs qualifiés."
  tags: [vente]
- q: "Combien de temps pour vendre en moyenne ?"
  a: "Selon le marché local et le positionnement prix, le délai médian varie entre 30 et 90 jours. Nous adaptons la stratégie toutes les 2 à 3 semaines selon les retours."
  tags: [vente]
- q: "Comment formuler une offre d’achat ?"
  a: "Rédigez une proposition écrite mentionnant prix, conditions suspensives (crédit…), délai de rétractation et date cible. Nous vous assistons pour sécuriser la rédaction."
  tags: [achat]
- q: "Quelle est la différence entre compromis et promesse ?"
  a: "Le compromis engage les deux parties ; la promesse unilatérale engage surtout le vendeur. Les deux actes prévoient un dépôt de garantie et des délais encadrés."
  tags: [achat]
- q: "Quelles pièces faut-il pour un dossier locatif ?"
  a: "Pièce d’identité, justificatif de domicile, 3 dernières fiches de paie ou justificatifs de revenus, dernier avis d’imposition, contrat de travail. Garant éventuel si nécessaire."
  tags: [location]
- q: "Caution et dépôt de garantie, quelle différence ?"
  a: "La caution (garant) s’engage à payer le loyer en cas de défaut. Le dépôt de garantie est une somme versée à l’entrée pour couvrir d’éventuelles dégradations."
  tags: [location]
- q: "Proposez-vous la gestion locative ?"
  a: "Oui, nous gérons la mise en location, les quittances, l’ajustement de loyer, l’assistance technique et l’assurance loyers impayés en option."
  tags: [gestion]
- q: "Comment se passe l’état des lieux ?"
  a: "Un état contradictoire avec photos datées est réalisé à l’entrée et à la sortie. Il sert de référence pour la restitution du dépôt de garantie."
  tags: [gestion]
- q: "Quelles charges de copropriété prévoir ?"
  a: "Elles couvrent les dépenses communes (entretien, syndic, eau/énergie des parties communes). Consultez les 3 derniers PV d’AG pour anticiper les travaux à venir."
  tags: [copro]
- q: "Qu’est-ce que le métrage Carrez ?"
  a: "Pour les lots en copropriété, la loi Carrez impose d’indiquer la surface privative. Les surfaces sous 1,80 m de hauteur ne sont pas comptées."
  tags: [copro]
- q: "Comment fonctionne la plus-value immobilière ?"
  a: "En résidence principale, la vente est exonérée. Pour une résidence secondaire/investissement, des abattements s’appliquent selon la durée de détention."
  tags: [fiscalite]
- q: "LMNP, c’est quoi ?"
  a: "Le statut Loueur Meublé Non Professionnel permet d’amortir le bien et le mobilier, optimisant la fiscalité des revenus locatifs meublés."
  tags: [fiscalite]
